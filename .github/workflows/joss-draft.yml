name: joss-draft

# Compiles paper.md to a PDF whenever it changes, so a broken bibliography or a citation that
# resolves to nothing is caught here rather than by a JOSS editor. The artifact is the draft.
on:
  push:
    paths: [paper.md, paper.bib, .github/workflows/joss-draft.yml]
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper.md
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper.pdf
